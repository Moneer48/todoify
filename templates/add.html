{% extends "layout.html" %} {% block title %}Add Task{% endblock %} {% block main %}
<h1>Add New Task</h1>
<hr>
<form action="/add" method="post" style="align-items: center;">

    <div class="container mt-4">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

    </div>
    <div class="d-flex justify-content-center">
        <div class="form-floating my-2" style="width: 100%; max-width: 400px;">
            <input type="text" name="title" class="form-control" id="title" placeholder="Title">
            <label for="title">Title (Optional)</label>
        </div>

    </div>
    <div class="d-flex justify-content-center">
        <div class="form-floating my-2" style="width: 100%; max-width: 400px;">
            <textarea required name="description" class="form-control" id="description" placeholder="Description"
                style="height: 150px;"></textarea>
            <label for="description">Description</label>
        </div>
    </div>
    <div class="d-flex justify-content-center my-2">
        <div class="form-floating" style="width: 100%; max-width: 400px;">
            <input type="date" name="due_date" class="form-control" id="dueDate" required>
            <label for="dueDate">Due Date</label>
        </div>
    </div>

    <div class="d-flex justify-content-center my-2">
        <div class="form-floating" style="width: 100%; max-width: 400px;">
            <input type="time" name="due_time" class="form-control" id="dueTime" required>
            <label for="dueTime">Due Time</label>
        </div>
    </div>


    <div>
        <button class="btn btn-lg btn-primary my-4 w-100" style="max-width: 400px;" type="submit">Add</button>
    </div>
</form>

{% endblock %}
