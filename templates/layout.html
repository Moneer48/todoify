<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
            </script>

        <!-- https://favicon.io/emoji-favicons/money-bag/ -->
        <link href="/static/todoify.png" rel="icon">

        <link href="/static/styles.css" rel="stylesheet">

        <title>ToDoify: {% block title %}{% endblock %}</title>
    </head>

    <body>

        {% if session["user_id"] %}
        <header class="container-fluid bg-success fixed-top py-2 px-3">
            <div class="row align-items-center text-center text-md-start">

                <div class="col-12 col-md-3 mb-2 mb-md-0 text-md-start">
                    <h1 class="h4 fw-bold mb-0 text-white">
                        <a href="/" class="text-white text-decoration-none">ToDoify</a>
                    </h1>
                </div>


                <div class="col-12 col-md-6 mb-2 mb-md-0 d-flex justify-content-center align-items-center gap-3">
                    <a href="/add" class="nav-link px-1" title="Add Task">
                        <img src="/static/add.svg" width="35" height="35" alt="Add Tasks">
                    </a>
                    <a href="/" class="nav-link px-1" title="Tasks">
                        <img src="/static/house.svg" width="37" height="37" alt="Tasks">
                    </a>
                    <a href="/star" class="nav-link px-1" title="Starred Tasks">
                        <img src="/static/star.svg" width="35" height="35" alt="Important Tasks">
                    </a>
                    <a href="/time-zone" class="nav-link px-1" title="Change Timezone">
                        <img src="/static/clock.svg" width="35" height="35" alt="Change Timezone">
                    </a>
                </div>



                <div class="col-12 col-md-3 d-flex flex-wrap justify-content-center justify-content-md-end gap-1">
                    <a href="/change-password" class="btn btn-primary btn-sm text-nowrap" style="height:30px">Forgot
                        Password</a>
                    <a href="/delete-account" class="btn btn-primary btn-sm text-nowrap" style="height:30px">Delete
                        Account</a>
                    <a href="/logout" class="btn btn-danger btn-sm text-nowrap" style="height:30px">Logout</a>
                </div>



            </div>
        </header>

        {% else %}
        <header
            class="d-flex flex-wrap align-items-center justify-content-around py-3 mb-4 bg-danger border-bottom fixed-top">

            <h1 class="h3 fw-bold mb-0 text-white">
                <a href="/" class="text-white text-decoration-none">ToDoify</a>
            </h1>
            <div>
                <a href="/login" class="btn btn-outline-primary me-2" id="login">Login</a>
                <a href="/sign-up" class="btn btn-primary me-2">Sign-up</a>
            </div>
        </header>
        {% endif %}





        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>

    </body>

</html>
